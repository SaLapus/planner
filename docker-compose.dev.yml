# Local development only: a throwaway Pocket ID on http://localhost:1411 (no Caddy, no HTTPS).
# Passkeys work on http://localhost. Run: docker compose -f docker-compose.dev.yml up -d
# See docs/auth-local-dev.md.
services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v1
    ports:
      - "127.0.0.1:1411:1411"
    environment:
      APP_URL: http://localhost:1411
      ENCRYPTION_KEY: dev-only-encryption-key-not-secret
      ANALYTICS_DISABLED: "true"
    volumes:
      - pocket_id_dev_data:/app/data

volumes:
  pocket_id_dev_data:
